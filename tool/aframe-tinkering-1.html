<!DOCTYPE html>
<html>
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="style.css" rel="stylesheet" type="text/css" />
        <style>
            /* CSS */
           .aframe-box{
    height:320px;
    border-radius:15px;
    overflow:hidden;
    margin-top:15px;
    border:2px solid #38bdf8;
    box-shadow: 0 0 25px #38bdf8, 0 0 60px rgba(56,189,248,0.5);
    background: radial-gradient(circle, rgba(56,189,248,0.15), transparent);
} 

        </style>

        <title>Title</title>
    </head>
    <body>
        <!-- HTML -->


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <!-- <script src="script.js"></script> -->



<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

<div class="aframe-box">
<a-scene embedded background="color: #020617">

    <!-- glowing platform -->
    <a-cylinder position="0 -1.2 -3"
                radius="1"
                height="0.2"
                color="#38bdf8"
                opacity="0.7"
                material="emissive: #38bdf8; emissiveIntensity: 1.5">
    </a-cylinder>

    <!-- hologram model -->
    <a-entity gltf-model="#model"
              position="0 0 -3"
              scale="1.2 1.2 1.2"
              rotation="0 0 0"
              material="transparent: true; opacity: 0.6"
              animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">
    </a-entity>

    <!-- glow light -->
    <a-light type="point" intensity="2" color="#38bdf8" position="0 1 -3"></a-light>
    <a-light type="ambient" intensity="0.5"></a-light>

</a-scene>
</div>



    </body>
</html>
